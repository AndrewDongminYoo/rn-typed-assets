# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: quality-configs
      ref: v0.5.0
      uri: https://github.com/AndrewDongminYoo/quality-configs
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - java@13.0.11
    - node@22.22.3
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - dotenv-linter
    - ktlint
    - oxipng
    - shellcheck
    - shfmt
    - svgo
  enabled:
    - actionlint@1.7.12
    - checkov@3.3.30
    - cspell@10.4.0
    - eslint@10.13.0
    - git-diff-check
    - grype@0.121.0
    - markdownlint@0.50.0
    - osv-scanner@2.7.0
    - pinact@4.1.1!:
        commands: [lint, upgrade]
    - prettier@3.9.10
    - trufflehog@3.99.7
    - yamllint@1.38.0
  definitions:
    - name: trufflehog
      commands:
        - name: lint
          run: trufflehog filesystem --json --fail --no-verification --no-update ${target}
          direct_configs:
            - .trunk/configs/trufflehog_to_sarif.py
          parser:
            runtime: python
            run: python3 .trunk/configs/trufflehog_to_sarif.py
  ignore:
    - linters: [cspell, shellcheck, shfmt]
      paths:
        - android/gradlew
        - example/android/gradlew
    - linters: [dotenv-linter]
      paths:
        - ios/.xcode.env
        - ios/.xcode.env.local
    - linters: [osv-scanner]
      paths:
        - '**/Podfile.lock'
actions:
  disabled:
    - trunk-fmt-pre-commit
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-upgrade-available
