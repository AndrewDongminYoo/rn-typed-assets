[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "Unresolved: deepmerge@4.3.1 is used only by the development path jest@30.5.2 -> jest-config@30.5.2 for local Jest configuration. The GitHub advisory and npm registry provide no patched release as of 2026-10-28. The package has zero runtime dependencies and the published CLI does not load Jest or deepmerge. This narrow disposition follows the user-authorized maintenance policy; it does not mark the vulnerability fixed. Re-evaluation owner: AndrewDongminYoo. Remove this entry when deepmerge publishes a compatible patch or Jest removes the dependency. Raw, configured and unrelated-vulnerability control scans are retained in the visible maintenance review evidence."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
reason = "Unresolved: glob@10.5.0 and glob@13.0.6 have no same-major patch as of 2026-11-05; the GitHub Advisory API identifies 14.0.2 as the first patched version. Evidence: npm ls glob --all traces these versions to jest@30.5.2 via jest-config, jest-runtime, @jest/reporters and babel-plugin-istanbul -> test-exclude. Inspection of their glob call sites shows no AbortSignal traversal budget; Jest uses synchronous glob calls. npm test -- --runInBand passed all 72 tests. The published CLI has no runtime dependencies. Other configurations may reach the vulnerable code; the vulnerability remains unresolved. Approved by AndrewDongminYoo on 2026-11-05 for these development dependencies. Re-evaluation owner: AndrewDongminYoo. Remove this entry when compatible patches are available or upstream consumers adopt patched glob versions; reassess if untrusted patterns or cancellation budgets enter this development path."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "Unresolved: minimatch@9.0.9 and minimatch@10.2.6 have no same-major patch as of 2026-11-05; the GitHub Advisory API identifies 11.0.1 as the first patched version. Evidence: npm ls minimatch --all traces these versions to eslint@10.14.0, typescript-eslint@8.72.1 and jest@30.5.2. Inspection of installed glob source confirms optimizationLevel: 2, so the vulnerable preprocessing path is reachable when glob processes patterns. Project lint and test patterns are repository-controlled. npm run lint and npm test -- --runInBand passed, including all 72 tests; passing tests do not prove non-reachability. The published CLI has no runtime dependencies. Risk from attacker-controlled patterns remains accepted for these development dependencies, not fixed. Approved by AndrewDongminYoo on 2026-11-05. Re-evaluation owner: AndrewDongminYoo. Remove this entry when compatible patches are available or upstream consumers adopt patched minimatch versions; reassess if untrusted patterns enter this development path."
